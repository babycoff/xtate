name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows ${{ matrix.toolchain }} Release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clangcl]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          if ('${{ matrix.toolchain }}' -eq 'clangcl') {
            if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
              choco install llvm -y --no-progress
            }
          }
          # Chocolatey updates the persistent PATH, not the current process.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = $machinePath + ';' + $userPath

      - name: Build
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -Toolchain '${{ matrix.toolchain }}' `
            -Config Release -Yes

      - name: Version and selftest
        shell: pwsh
        run: |
          if (-not (Test-Path .\bin\xtate.exe)) {
            throw 'bin\xtate.exe was not produced'
          }
          .\bin\xtate.exe --version
          .\bin\xtate.exe --selftest

      - name: Parser and i18n tests
        shell: bash
        run: |
          XTATE_BIN=./bin/xtate.exe bash tests/target/test.sh
          XTATE_BIN=./bin/xtate.exe bash tests/i18n/test.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xtate-windows-${{ matrix.toolchain }}-release
          path: bin/xtate.exe
          if-no-files-found: error
  mingw:
    name: Windows MinGW Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_OPENSSL=OFF \
            -DWITH_PCRE2=OFF \
            -DWITH_LIBXML2=OFF \
            -DWITH_BSON=OFF \
            -DWITH_MONGOC=OFF
          cmake --build build-mingw -j 2

      - name: Version and selftest
        shell: msys2 {0}
        run: |
          ./build-mingw/xtate.exe --version
          ./build-mingw/xtate.exe --selftest

      - name: Parser and i18n tests
        shell: msys2 {0}
        run: |
          XTATE_BIN=./build-mingw/xtate.exe bash tests/target/test.sh
          XTATE_BIN=./build-mingw/xtate.exe bash tests/i18n/test.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xtate-windows-mingw-release
          path: build-mingw/xtate.exe
          if-no-files-found: error

