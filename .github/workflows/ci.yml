name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcap-dev libssl-dev libpcre2-dev libxml2-dev \
            libbson-dev libmongoc-dev clang

      - name: Header self-containment
        run: |
          bash tests/include/check_headers.sh

      - name: Module template compile
        run: |
          CC="${{ matrix.compiler }}" bash tests/module-examples/test.sh

      - name: Build
        run: |
          ./build.sh \
            --compiler "${{ matrix.compiler }}" \
            --config "${{ matrix.config }}" \
            --generator ninja

      - name: Selftest
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            ./bin/xtate_debug --selftest
          else
            ./bin/xtate --selftest
          fi

      - name: Target syntax tests
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/target/test.sh

      - name: i18n and interactive tests
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/i18n/test.sh
          XTATE_BIN="$BIN" bash tests/interactive/test.sh
          XTATE_BIN="$BIN" bash tests/config/test.sh
          XTATE_BIN="$BIN" python3 tests/config/fuzz.py
          XTATE_BIN="$BIN" bash tests/jarm/test.sh

      - name: ZBanner pcap offline regression
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/zbanner/run.sh

      - name: Restore fuzz corpus
        if: matrix.compiler == 'clang' && matrix.config == 'release'
        uses: actions/cache@v4
        with:
          path: tests/fuzz/corpus-working
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('tests/fuzz/**/*.c', 'tests/fuzz/run.sh', 'src/proto/proto-preprocess.c', 'src/target/target-parse.c') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Parser fuzz smoke
        if: matrix.compiler == 'clang' && matrix.config == 'release'
        env:
          FUZZ_SECONDS: 10
        run: |
          bash tests/fuzz/run.sh

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.compiler }}-${{ matrix.config }}
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore

      - name: PTY terminal test
        if: matrix.compiler == 'gcc' && matrix.config == 'release'
        env:
          XTATE_BIN: ./bin/xtate
        run: |
          bash tests/interactive/tty.sh
