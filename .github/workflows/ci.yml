name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcap-dev libssl-dev libpcre2-dev libxml2-dev \
            libbson-dev libmongoc-dev clang

      - name: Header self-containment
        run: |
          bash tests/include/check_headers.sh

      - name: Module template compile
        run: |
          CC="${{ matrix.compiler }}" bash tests/module-examples/test.sh

      - name: Build
        run: |
          ./build.sh \
            --compiler "${{ matrix.compiler }}" \
            --config "${{ matrix.config }}" \
            --generator ninja

      - name: Selftest
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            ./bin/xtate_debug --selftest
          else
            ./bin/xtate --selftest
          fi

      - name: Target syntax tests
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/target/test.sh

      - name: i18n and interactive tests
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/i18n/test.sh
          XTATE_BIN="$BIN" bash tests/interactive/test.sh
          XTATE_BIN="$BIN" bash tests/config/test.sh
          XTATE_BIN="$BIN" python3 tests/config/fuzz.py
          XTATE_BIN="$BIN" bash tests/jarm/test.sh

      - name: Offline pcap regression matrices
        if: matrix.config == 'release'
        run: |
          if [[ "${{ matrix.config }}" == "debug" ]]; then
            BIN=./bin/xtate_debug
          else
            BIN=./bin/xtate
          fi
          XTATE_BIN="$BIN" bash tests/zbanner/run.sh
          XTATE_BIN="$BIN" bash tests/http-pcap/run.sh
          XTATE_BIN="$BIN" bash tests/tcp-syn-pcap/run.sh
          XTATE_BIN="$BIN" bash tests/http-state-pcap/run.sh
          XTATE_BIN="$BIN" bash tests/h2c-pcap/run.sh
          XTATE_BIN="$BIN" bash tests/udp-pcap/run.sh

      - name: Restore fuzz corpus
        if: matrix.compiler == 'clang' && matrix.config == 'release'
        uses: actions/cache@v4
        with:
          path: tests/fuzz/corpus-working
          key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('tests/fuzz/**/*.c', 'tests/fuzz/run.sh', 'src/proto/proto-preprocess.c', 'src/target/target-parse.c') }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Parser fuzz smoke
        if: matrix.compiler == 'clang' && matrix.config == 'release'
        env:
          FUZZ_SECONDS: 10
        run: |
          bash tests/fuzz/run.sh

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.compiler }}-${{ matrix.config }}
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore

      - name: PTY terminal test
        if: matrix.compiler == 'gcc' && matrix.config == 'release'
        env:
          XTATE_BIN: ./bin/xtate
        run: |
          bash tests/interactive/tty.sh

  integration:
    name: Linux integration (MCP/Skill/GUI/control)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcap-dev libssl-dev libpcre2-dev libxml2-dev \
            libbson-dev libmongoc-dev python3 python3-jsonschema

      - name: Build release binary
        run: |
          ./build.sh --compiler gcc --config release --generator ninja
          sudo setcap cap_net_raw,cap_net_admin+ep ./bin/xtate

      - name: Prepare integration environment
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: mkdir -p "$XTATE_STATE_DIR"

      - name: Version consistency
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/release/test_version_consistency.py --skip-docs

      - name: MCP contract
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/mcp/test_mcp_contract.py

      - name: Agent Skill contract
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/skill/test_skill_contract.py

      - name: GUI contracts
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/gui/test_gui.py

      - name: Control plane contracts
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/control/test_control.py

      - name: Scan-request runtime
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/schema/test_scan_request_runtime.py

      - name: Input generation
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/input/test_generate.py

      - name: Schema validator
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/schema/validate_schemas.py

      - name: Module validator
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_STATE_DIR: ${{ runner.temp }}/xtate-state
          XTATE_MCP_DOCS_DIR: ${{ github.workspace }}
        run: python3 tests/schema/validate_modules.py

  docker:
    name: Ubuntu 24.04 full-feature Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -f docker/ubuntu24-build/Dockerfile -t xtate:ci .

      - name: Capability and selftest gate
        run: |
          docker run --rm xtate:ci --selftest
          docker run --rm xtate:ci --list-capabilities | tee /tmp/caps.json
          python3 -c 'import json; caps=json.load(open("/tmp/caps.json")); assert all(caps[k] is True for k in ("raw_sockets","http3","quic_transport","zstd")), caps; assert caps["modules"]["scan"] == 12, caps'

      - name: Host GUI and preflight smoke
        run: |
          docker run -d --name xtate-ci-gui \
            -p 127.0.0.1:8787:8787 \
            -e XTATE_GUI_ALLOW_REMOTE=1 \
            -e XTATE_GUI_PUBLIC_URL=http://127.0.0.1:8787/ \
            --cap-add=NET_RAW --cap-add=NET_ADMIN \
            xtate:ci --gui --gui-listen=0.0.0.0:8787
          for i in $(seq 1 30); do
            TOKEN=$(docker logs xtate-ci-gui 2>&1 | sed -n 's/.*GUI session token: //p' | tail -1)
            if [ -n "$TOKEN" ] && curl -fsS -H "X-Xtate-GUI-Token: $TOKEN" \
              http://127.0.0.1:8787/ -o /tmp/page.html; then break; fi
            sleep 1
          done
          test -s /tmp/page.html
          test -n "$TOKEN"
          curl -fsS -H "X-Xtate-GUI-Token: $TOKEN" http://127.0.0.1:8787/api/system \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["capabilities"]["http3"] is True'
          curl -fsS -X POST -H "X-Xtate-GUI-Token: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"scan":"tcp-syn","targets":["172.17.0.1"],"ports":[1],"rate":10,"timeout_sec":5,"authorized":true}' \
            http://127.0.0.1:8787/api/preflight \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True, d'

      - name: Cleanup
        if: always()
        run: docker rm -f xtate-ci-gui 2>/dev/null || true

  sanitizers:
    name: Linux clang ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config clang \
            libpcap-dev libssl-dev libpcre2-dev libxml2-dev \
            libbson-dev libmongoc-dev \
            libngtcp2-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev

      - name: ASan + UBSan build and pcap smoke
        run: CC=clang bash tests/sanitizers/run.sh

