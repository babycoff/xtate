name: lab-encrypted

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  encrypted-protocols:
    name: TLS/H2 + QUIC/HTTP3 local lab
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libpcap-dev libssl-dev libpcre2-dev libxml2-dev \
            libbson-dev libmongoc-dev \
            libngtcp2-dev libngtcp2-crypto-gnutls-dev libgnutls28-dev

      - name: Build release
        run: ./build.sh --compiler gcc --config release --generator ninja

      - uses: docker/setup-buildx-action@v3

      - name: Build local target image
        uses: docker/build-push-action@v6
        with:
          context: tests/lab
          file: tests/lab/Dockerfile
          tags: xtate-lab-target:24.04
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: TLS + H2 local CI
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-h2.sh

      - name: TLS + H2 semantic depth
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-h2-depth.sh

      - name: H2C semantic depth
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-h2c-depth.sh

      - name: Protocol probe lab
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-probes.sh

      - name: Batch B protocol lab
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-batch-b.sh

      - name: Batch C protocol lab
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-batch-c.sh

      - name: QUIC + HTTP3 local CI
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-quic.sh

      - name: QUIC + HTTP3 semantic depth
        env:
          XTATE_BIN: ./bin/xtate
          XTATE_LAB_IMAGE: xtate-lab-target:24.04
          XTATE_LAB_TARGET_IMAGE: xtate-lab-target:24.04
        run: bash tests/lab/ci-quic-depth.sh

      - name: Upload lab logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-encrypted-logs
          path: tests/lab/ci-*.log
          if-no-files-found: ignore
