<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="seqTitle seqDesc">
<title id="seqTitle">ZBanner sequence diagram</title>
<desc id="seqDesc">Stateless TCP exchange: SYN with a SipHash cookie, SYN-ACK acknowledging cookie plus one, ACK carrying the probe payload, ACK carrying the banner, then RST. No TCB and no timeout table.</desc>
<defs>
  <marker id="head-b45309" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/></marker>
  <marker id="head-0e7490" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0e7490"/></marker>
  <marker id="head-7c3aed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
  <marker id="head-0f766e" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0f766e"/></marker>
</defs>
<rect width="1200" height="820" fill="#ffffff"/><text x="40" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="1" opacity="1">ZBANNER</text><text x="178" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="1" opacity="1">// STATELESS TCP HANDSHAKE</text><text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">two packets in, one real TCP conversation out — the peer keeps the state, we keep the arithmetic</text><text x="1160" y="54" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" fill="#b45309" text-anchor="end" letter-spacing="1.5" opacity="1">SIPHASH COOKIE</text><text x="1160" y="76" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="end" letter-spacing="0" opacity="1">no TCB · no timeout table</text><line x1="40" y1="96" x2="1160" y2="96" stroke="#e2e8f0" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="180" y="110" width="240" height="62" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.6" opacity="1"/><rect x="180" y="122" width="4" height="38" rx="2" fill="#b45309" stroke="none" stroke-width="1" opacity="1"/><text x="202" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0.5" opacity="1">XTATE</text><text x="202" y="156" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">scanner · stateless</text><rect x="780" y="110" width="240" height="62" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.6" opacity="1"/><rect x="780" y="122" width="4" height="38" rx="2" fill="#0e7490" stroke="none" stroke-width="1" opacity="1"/><text x="802" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" letter-spacing="0.5" opacity="1">TARGET</text><text x="802" y="156" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" letter-spacing="0" opacity="1">TCP stack · stateful</text><line x1="300" y1="172" x2="300" y2="700" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 6" opacity="1" stroke-linecap="round"/><line x1="900" y1="172" x2="900" y2="700" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 6" opacity="1" stroke-linecap="round"/><circle cx="300" cy="220" r="3.4" fill="#b45309"/><circle cx="900" cy="220" r="3.4" fill="#b45309"/><line x1="300" y1="220" x2="900" y2="220" stroke="#b45309" stroke-width="2" opacity="1" stroke-linecap="round"/>
<line x1="300" y1="220" x2="900" y2="220" stroke="#b45309" stroke-width="2" marker-end="url(#head-b45309)" stroke-linecap="round"/><text x="600" y="204" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0.8" opacity="1">01   SYN</text><rect x="379.23" y="232" width="441.54" height="30" rx="7" fill="#fffdf5" stroke="#b45309" stroke-width="1.2" opacity="1"/><text x="600" y="250.8" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" letter-spacing="0" opacity="1">seq = SipHash(entropy, ip_them, port_them, ip_me, port_me)</text><text x="600" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">the cookie is the ISN</text><circle cx="900" cy="325" r="3.4" fill="#0e7490"/><circle cx="300" cy="325" r="3.4" fill="#0e7490"/><line x1="900" y1="325" x2="300" y2="325" stroke="#0e7490" stroke-width="2" opacity="1" stroke-linecap="round"/>
<line x1="900" y1="325" x2="300" y2="325" stroke="#0e7490" stroke-width="2" marker-end="url(#head-0e7490)" stroke-linecap="round"/><text x="600" y="309" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle" letter-spacing="0.8" opacity="1">02   SYN-ACK</text><rect x="528.96" y="337" width="142.07999999999998" height="30" rx="7" fill="#f0fdff" stroke="#0e7490" stroke-width="1.2" opacity="1"/><text x="600" y="355.8" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" letter-spacing="0" opacity="1">ack = cookie + 1</text><text x="600" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">recompute the cookie · validate ackno</text><circle cx="300" cy="435" r="3.4" fill="#b45309"/><circle cx="900" cy="435" r="3.4" fill="#b45309"/><line x1="300" y1="435" x2="900" y2="435" stroke="#b45309" stroke-width="2" opacity="1" stroke-linecap="round"/>
<line x1="300" y1="435" x2="900" y2="435" stroke="#b45309" stroke-width="2" marker-end="url(#head-b45309)" stroke-linecap="round"/><text x="600" y="419" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0.8" opacity="1">03   ACK + PROBE</text><rect x="446.96500000000003" y="447" width="306.07" height="30" rx="7" fill="#fffdf5" stroke="#b45309" stroke-width="1.2" opacity="1"/><text x="600" y="465.8" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" letter-spacing="0" opacity="1">seq = their ack  ·  ack = their seq + 1</text><text x="600" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">the probe payload rides the third ACK</text><circle cx="900" cy="545" r="3.4" fill="#0e7490"/><circle cx="300" cy="545" r="3.4" fill="#0e7490"/><line x1="900" y1="545" x2="300" y2="545" stroke="#0e7490" stroke-width="2" opacity="1" stroke-linecap="round"/>
<line x1="900" y1="545" x2="300" y2="545" stroke="#0e7490" stroke-width="2" marker-end="url(#head-0e7490)" stroke-linecap="round"/><text x="600" y="529" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle" letter-spacing="0.8" opacity="1">04   ACK + BANNER</text><rect x="471.92" y="557" width="256.15999999999997" height="30" rx="7" fill="#f0fdff" stroke="#0e7490" stroke-width="1.2" opacity="1"/><text x="600" y="575.8" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" letter-spacing="0" opacity="1">ackno = cookie + payload_len + 1</text><text x="600" y="601" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">hand the bytes to the ProbeModule</text><circle cx="300" cy="655" r="3.4" fill="#7c3aed"/><circle cx="900" cy="655" r="3.4" fill="#7c3aed"/><line x1="300" y1="655" x2="900" y2="655" stroke="#7c3aed" stroke-width="2" opacity="1" stroke-linecap="round"/>
<line x1="300" y1="655" x2="900" y2="655" stroke="#7c3aed" stroke-width="2" marker-end="url(#head-7c3aed)" stroke-linecap="round"/><text x="600" y="639" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" letter-spacing="0.8" opacity="1">05   RST</text><rect x="489.745" y="667" width="220.51" height="30" rx="7" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2" opacity="1"/><text x="600" y="685.8" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle" letter-spacing="0" opacity="1">close · nothing to clean up</text><text x="600" y="711" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0" opacity="1">no per-target state existed</text><rect x="40" y="730" width="1120" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="1"/><text x="58" y="754" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" letter-spacing="0" opacity="1">$</text><text x="76" y="754" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start" letter-spacing="0" opacity="1">cookie = siphash24(entropy, ip_them, port_them, ip_me, port_me)</text><text x="58" y="777" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.8" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1"># 32-bit ISN · no TCB · no timeout table · no retransmission bookkeeping</text><text x="1142" y="754" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="end" letter-spacing="0" opacity="1">→ ISN</text><text x="40" y="810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="start" letter-spacing="0" opacity="1">solid arrows: packets on the wire</text><text x="1160" y="810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="end" letter-spacing="0" opacity="1">state lives in the peer's TCP stack</text></svg>